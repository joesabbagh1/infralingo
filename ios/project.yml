name: Infralingo
options:
  bundleIdPrefix: com.infralingo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    OTHER_LDFLAGS: "-lsqlite3"

targets:
  Infralingo:
    type: application
    platform: iOS
    sources:
      - path: Infralingo
      - path: Resources/content
        type: folder
        buildPhase: resources
      - path: Resources/licenses
        type: folder
        buildPhase: resources
      - path: Resources/Nunito.ttf
        buildPhase: resources
      - path: Resources/Assets.xcassets
    info:
      path: Infralingo/Info.plist
      properties:
        CFBundleDisplayName: Infralingo
        UILaunchScreen: {}
        UIAppFonts:
          - Nunito.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

  InfralingoTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
      - path: Resources/content
        type: folder
        buildPhase: resources
    dependencies:
      - target: Infralingo

schemes:
  Infralingo:
    build:
      targets:
        Infralingo: all
        InfralingoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InfralingoTests
