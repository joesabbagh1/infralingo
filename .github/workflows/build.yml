name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: infralingo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Update rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Infralingo-latest.apk
          NOTES="Automated debug build of commit ${GITHUB_SHA::7}. Download Infralingo-latest.apk and install on your Android device."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Infralingo-latest.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest Infralingo-latest.apk --title "Latest build" --notes "$NOTES"
          fi

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Regenerate project if xcodegen output is missing
        run: |
          if [ ! -d ios/Infralingo.xcodeproj ]; then
            brew install xcodegen
            xcodegen -s ios/project.yml
          fi

      - name: Run iOS unit tests
        run: |
          xcodebuild -project ios/Infralingo.xcodeproj -scheme Infralingo \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath ios/build/DerivedData \
            test | tail -30

      - name: Build simulator app
        run: |
          xcodebuild -project ios/Infralingo.xcodeproj -scheme Infralingo \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath ios/build/DerivedData \
            build | tail -5
