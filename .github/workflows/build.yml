name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.INFRALINGO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "INFRALINGO_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/infralingo.jks"
          echo "INFRALINGO_KEYSTORE_FILE=$RUNNER_TEMP/infralingo.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          INFRALINGO_KEYSTORE_PASSWORD: ${{ secrets.INFRALINGO_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: infralingo-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Update rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Infralingo-latest.apk
          NOTES="Build ${GITHUB_RUN_NUMBER} of commit ${GITHUB_SHA::7}. Download Infralingo-latest.apk and install it on your Android device. Builds from now on update in place and keep your progress."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Infralingo-latest.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest Infralingo-latest.apk --title "Latest build" --notes "$NOTES"
          fi

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Regenerate project if xcodegen output is missing
        run: |
          if [ ! -d ios/Infralingo.xcodeproj ]; then
            brew install xcodegen
            xcodegen -s ios/project.yml
          fi

      - name: Run iOS unit tests
        run: |
          xcodebuild -project ios/Infralingo.xcodeproj -scheme Infralingo \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath ios/build/DerivedData \
            test | tail -30

      - name: Build simulator app
        run: |
          xcodebuild -project ios/Infralingo.xcodeproj -scheme Infralingo \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath ios/build/DerivedData \
            build | tail -5
